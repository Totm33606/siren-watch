[project]
name = "sirenwatch"
version = "0.1.0"
description = "Daily Airflow pipeline collecting French insolvency notices (BODACC) into an S3 data lake — raw JSON, typed Parquet, validation, DuckDB queries."
readme = "README.md"
# Même version mineure que l'image apache/airflow:3.4.0 (Python 3.13), pour que le
# code testé en local soit celui qui tourne dans les conteneurs.
requires-python = ">=3.13,<3.14"
authors = [{ name = "Thomas" }]
# Expression SPDX (PEP 639) : la forme `{ text = "MIT" }` est dépréciée.
license = "MIT"
license-files = ["LICENSE"]
keywords = ["airflow", "data-engineering", "bodacc", "minio", "duckdb", "parquet"]

dependencies = [
    "boto3>=1.43",
    "httpx>=0.28",
    "pyarrow>=25",
    # Windows n'a pas de base de fuseaux horaires système : zoneinfo la trouve ici.
    "tzdata>=2025.2 ; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/Totm33606/siren-watch"

[project.scripts]
# Extraction manuelle d'une date, hors Airflow : `uv run sirenwatch-extract 2026-11-06`.
sirenwatch-extract = "sirenwatch.bodacc.extract:main"

# Groupe de dépendances (PEP 735) plutôt qu'« extra » optionnel : les outils de dev
# ne sont pas publiés avec le paquet, et `uv sync` / `uv run` les installent par
# défaut, sans option à ajouter dans le Makefile ni dans la CI.
[dependency-groups]
dev = [
    "duckdb>=2.0.0",
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "A", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests qui appellent un vrai service (MinIO) ; exclus de `make test`",
]
addopts = "-ra -m 'not integration' --cov=src --cov-report=term-missing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sirenwatch"]
