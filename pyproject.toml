[project]
name = "sirenwatch"
version = "0.1.0"
description = "Daily Airflow pipeline collecting French insolvency notices (BODACC) into an S3 data lake — raw JSON, typed Parquet, validation, DuckDB queries."
readme = "README.md"
# Same minor version as the apache/airflow:3.4.0 image (Python 3.13), so that the code
# tested locally is the code running in the containers.
requires-python = ">=3.13,<3.14"
authors = [{ name = "Thomas" }]
# SPDX expression (PEP 639): the `{ text = "MIT" }` form is deprecated.
license = "MIT"
license-files = ["LICENSE"]
keywords = ["airflow", "data-engineering", "bodacc", "minio", "duckdb", "parquet"]

dependencies = [
    "boto3>=1.43",
    "httpx>=0.28",
    "pyarrow>=25",
    # Windows has no system time zone database: zoneinfo finds it in this package.
    "tzdata>=2025.2 ; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/Totm33606/siren-watch"

[project.scripts]
# Manual extraction of one date, outside Airflow:
#   uv run --env-file .env sirenwatch-extract 2026-11-06
sirenwatch-extract = "sirenwatch.bodacc.extract:main"

# Dependency group (PEP 735) rather than an optional extra: dev tools are not published
# with the package, and `uv sync` / `uv run` install them by default, with no extra
# option in the Makefile or the CI.
[dependency-groups]
dev = [
    "duckdb>=2.0.0",
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "A", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that call a real service (MinIO); excluded from `make test`",
]
addopts = "-ra -m 'not integration' --cov=src --cov-report=term-missing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sirenwatch"]
