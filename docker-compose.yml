# SirenWatch: Airflow 3.4.0 (LocalExecutor) + MinIO
#
# Based on the official Airflow 3.4.0 docker-compose.yaml:
#   https://airflow.apache.org/docs/apache-airflow/3.4.0/docker-compose.yaml
# Changes (detailed in the comments below):
#   - CeleryExecutor -> LocalExecutor: no redis, airflow-worker or flower, and no
#     AIRFLOW__CELERY__* variables.
#   - No airflow-triggerer (no deferrable operators in V1).
#   - Example DAGs disabled.
#   - Secrets (JWT, Fernet, admin account) read from .env, with no hard-coded default.
#   - MinIO (S3 storage) added, with a one-shot service that creates the bucket.
#
# All variables come from .env (generated from .env.example by `make up`).

x-airflow-common:
  &airflow-common
  # Image built from the project's Dockerfile: apache/airflow:3.4.0 + the sirenwatch
  # package (src/). `image:` names the result, shared by all Airflow services;
  # `make up` rebuilds it (--build) when src/ changes.
  build:
    context: .              # folder sent to Docker (filtered by .dockerignore)
    dockerfile: Dockerfile  # the image recipe (the default value, made explicit)
  image: sirenwatch-airflow:3.4.0
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    # LocalExecutor: the scheduler runs tasks as local subprocesses. No broker (Redis)
    # or separate workers needed for a single DAG.
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # Postgres credentials hard-coded as in the official file: the database is only
    # reachable from the internal Docker network (no published port).
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # Airflow 3: tasks talk to the API server through the Execution API, no longer
    # directly to the database. Tokens are signed with this JWT secret, which must be
    # the same on every component. `:?` makes compose fail if it is missing.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:?définir AIRFLOW__API_AUTH__JWT_SECRET dans .env}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # For quick tests only; otherwise extend the image (Dockerfile).
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    # --- S3 access for the task code ---
    # Inside the containers, MinIO is reached by its service name `minio`; from this
    # machine (DuckDB) it is localhost:9000, hence this override of the .env value.
    # Moving to real S3 = changing these variables, nothing else.
    SIRENWATCH_S3_ENDPOINT_URL: http://minio:9000
    # S3 credentials: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and AWS_DEFAULT_REGION come
    # unchanged from .env through env_file, as on this machine. These standard names are
    # read by boto3 automatically. They are not derived from MINIO_ROOT_*, which is only
    # used by the MinIO server.
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
  # Host UID + GID 0: files written to logs/ stay readable on the host.
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    # Published on 127.0.0.1 only: the UI is reachable from this machine, not from the
    # local network (by default, Docker publishes on all interfaces).
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      # With the LocalExecutor, tasks run in this container: they need MinIO, with
      # its bucket created.
      minio-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # One-shot service: migrates the database, creates the admin account and the shared
  # folders with the right permissions. Same as the official file.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"
        echo
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:0"
        echo
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:?définir _AIRFLOW_WWW_USER_PASSWORD dans .env}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  # One-off CLI: `docker compose run --rm airflow-cli <command>`.
  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Common volumes + tests/ (read-only) for `make test-dags`. YAML cannot extend an
    # inherited list, so the full list is repeated.
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
      - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
      - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
      - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
      - ${AIRFLOW_PROJ_DIR:-.}/tests:/opt/airflow/tests:ro
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

  # --- S3 storage ---
  # The MinIO project was archived (April 2026) and its official images are no longer
  # published. This is Chainguard's image, built from the MinIO sources and maintained.
  # Only the `latest` tag is free, so the image is pinned by digest to keep `make up`
  # reproducible. To update:
  #   docker buildx imagetools inspect cgr.dev/chainguard/minio:latest
  minio:
    image: &minio-image cgr.dev/chainguard/minio@sha256:869ca3178831d9f521ea02258a0f0d4fbc1e9f84302e707514e1f861b860865d
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?définir MINIO_ROOT_USER dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?définir MINIO_ROOT_PASSWORD dans .env}
      # `local` alias for the bundled mc client, used by the healthcheck.
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@localhost:9000
    ports:
      # 127.0.0.1: reachable from this machine only (see airflow-apiserver).
      - "127.0.0.1:9000:9000"   # S3 API (boto3, DuckDB)
      - "127.0.0.1:9001:9001"   # web console
    # Named volume rather than a project folder: with Docker Desktop (Windows), bind
    # mounts are slow and cause permission issues.
    volumes:
      - minio-data:/data
    healthcheck:
      # No curl in the image, but `mc` is there.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always

  # One-shot service: creates the bucket; `--ignore-existing` makes it idempotent.
  # Reuses the minio image (which includes mc): a single image to pin.
  minio-init:
    image: *minio-image
    entrypoint: ["mc"]
    command: ["mb", "--ignore-existing", "local/${SIRENWATCH_S3_BUCKET:-sirenwatch}"]
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres-db-volume:
  minio-data:
